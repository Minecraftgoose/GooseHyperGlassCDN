<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<title>GooseHyperGlassCDN 2.5</title>
<style>
  @font-face {
    font-family: 'Google Sans Flex';
    src: url('./fonts/GoogleSansFlex.ttf') format('truetype');
    font-weight: 100 900;
    font-stretch: 50% 200%;
    font-style: normal;
    font-display: swap;
  }
  :root { color-scheme: dark; }
  /* 全局滚动条美化（玻璃质感） */
  ::-webkit-scrollbar { width: 10px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #2f6fb8, #1f4a7a);
    border-radius: 8px;
    border: 2px solid #0a0e17;
  }
  ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #3d82d0, #2f6fb8); }
  ::-webkit-scrollbar-corner { background: transparent; }
  * { scrollbar-width: thin; scrollbar-color: #2f6fb8 #0a0e17; }
  * { box-sizing: border-box; }
  liquid-glass { -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
  body {
    margin: 0; color: #e8eef6;
    background:
      linear-gradient(rgba(10, 14, 23, 0.3), rgba(10, 14, 23, 0.3)),
      url('./wallpaper.jpg') center / cover no-repeat fixed;
    font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 16px 80px;
  }
  header { max-width: 1320px; margin: 0 auto 28px; text-align: center; }
  h1 { font-size: 34px; font-weight: 700; margin: 0 0 6px; }
  .author { font-size: 13px; color: #4a6079; margin: 0 0 16px; }
  .badges { margin: 0 0 16px; }
  .badges img { vertical-align: middle; margin: 2px 3px; border-radius: 4px; }
  p.lead { color: #9fb3c8; line-height: 1.7; margin: 0 auto 12px; max-width: 560px; font-size: 14px; }
  .doc-link { display: inline-block; background: #2f6fb8; color: #fff; text-decoration: none; padding: 8px 20px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-bottom: 32px; }
  .doc-link:hover { background: #3d82d0; }
  .nav { max-width: 1320px; margin: 0 auto 26px; display: flex; flex-wrap: nowrap; gap: 8px; justify-content: center; overflow-x: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
  .nav::-webkit-scrollbar { height: 4px; }
  .nav::-webkit-scrollbar-thumb { background: #2a3b52; border-radius: 2px; }
  .nav button {
    background: #16202e; color: #cfe3ff; border: 1px solid #243248;
    border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: background .15s, border-color .15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .nav button:hover { background: #1d2a3c; }
  .nav button.active { background: #2f6fb8; border-color: #2f6fb8; color: #fff; }
  .stage { max-width: 1320px; margin: 0 auto; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .pair { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .pair-item { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .pair-item .label { font-size: 13px; color: #000; }
  .frame { width: 640px; height: 340px; border-radius: 24px; overflow: hidden; background: transparent; }
  .frame.single { width: 640px; height: 480px; }
  .frame.button { width: 400px; height: 160px; }
  liquid-glass { display: block; width: 100%; height: 100%; }
  .loading { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 200px; color: #6a8099; font-size: 13px; }
  .loading .spinner { width: 20px; height: 20px; border: 2px solid #243248; border-top-color: #2f6fb8; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .splash {
    position: fixed; inset: 0; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6, 10, 16, 0.65);
    backdrop-filter: blur(8px);
    transition: opacity 0.3s;
  }
  .splash.hidden { opacity: 0; pointer-events: none; }
  .splash-card {
    position: relative;
    background: rgba(18, 26, 38, 0.92);
    border: 1px solid rgba(120, 160, 210, 0.25);
    border-radius: 20px;
    padding: 36px 40px 32px;
    max-width: 500px; width: calc(100% - 40px);
    text-align: center;
    color: #e8eef6;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
  }
  .splash-card h2 { margin: 0 0 14px; font-size: 24px; font-weight: 700; }
  .splash-card p { font-size: 14px; line-height: 2; color: #9fb3c8; margin: 0; }
  .splash-decl { margin: 0 0 8px !important; font-size: 14px !important; line-height: 1.9 !important; }
  .splash-list {
    list-style: none; padding: 0; margin: 0 0 14px;
    text-align: left; font-size: 14px; line-height: 1.9;
  }
  .splash-list li {
    display: flex; align-items: baseline; gap: 20px;
    color: #9fb3c8;
    margin-bottom: 10px;
  }
  .splash-tag {
    flex-shrink: 0; min-width: 60px;
    padding: 3px 10px; border-radius: 4px;
    background: #243248; color: #cfe3ff;
    font-size: 11px; text-align: center;
  }
  .splash-note { font-size: 12px; color: #6a8099; }
  .splash-github {
    display: block; margin: 0 0 18px;
    font-size: 14px; text-decoration: none; text-align: center;
  }
  .splash-card a { color: #6fc0ec; text-decoration: none; }
  .splash-card a:hover { text-decoration: underline; }
  .splash-close {
    position: absolute; top: 10px; right: 16px;
    background: none; border: none; color: #6a8099; font-size: 24px; line-height: 1;
    cursor: pointer; padding: 4px;
  }
  .splash-close:hover { color: #e8eef6; }
  .splash-cta {
    margin-top: 22px; background: #2f6fb8; color: #fff; border: none;
    padding: 11px 32px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .splash-cta:hover { background: #3d82d0; }
  /* ---- 引导式介绍层 ---- */
  .guide {
    position: fixed; inset: 0; z-index: 998;
    display: none; flex-direction: column;
    background: #0a0e17;
  }
  .guide.on { display: flex; }
  .guide-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px;
  }
  .guide-brand { font-size: 15px; font-weight: 700; color: #cfe3ff; letter-spacing: .3px; }
  .guide-exit {
    background: none; border: 1px solid #243248; color: #9fb3c8;
    padding: 6px 14px; border-radius: 999px; font-size: 12px; cursor: pointer;
  }
  .guide-exit:hover { border-color: #3d82d0; color: #cfe3ff; }
  .guide-stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 0 40px;
    overflow: hidden;
    position: relative;
  }
  .guide-step {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    max-width: 760px; max-height: 68vh;
  }
  .guide-step liquid-glass,
  .guide-step liquid-glass-search {
    display: block; width: 100%; height: 100%;
  }
  .guide-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; cursor: pointer; user-select: none;
    background: #16202e; border: 1px solid #243248; color: #cfe3ff;
    transition: opacity .2s, background .15s;
    z-index: 10;
  }
  .guide-arrow:hover { background: #1d2a3c; }
  .guide-arrow.prev { left: 18px; }
  .guide-arrow.next { right: 18px; }
  .guide-arrow.off { opacity: .2; pointer-events: none; }
  .guide-bar {
    padding: 18px 22px 26px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .guide-text { font-size: 13px; color: #9fb3c8; text-align: center; min-height: 18px; }
  .guide-hl { color: #e8eef6; font-weight: 600; }
  .guide-tip { color: #6a8099; }
  .guide-dots { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 90vw; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2a3b52; cursor: pointer; transition: transform .2s, background .2s;
  }
  .dot:hover { background: #3d82d0; }
  .dot.active { background: #3d82d0; transform: scale(1.4); }
  /* 组件滑动过渡 */
  .guide-step {
    transition: transform .3s cubic-bezier(.22, .61, .36, 1), opacity .3s cubic-bezier(.22, .61, .36, 1);
  }
  .guide-step.slide-in-right { transform: translateX(60px); opacity: 0; }
  .guide-step.slide-in-left { transform: translateX(-60px); opacity: 0; }
  .guide-step.slide-out-right { transform: translateX(-60px); opacity: 0; }
  .guide-step.slide-out-left { transform: translateX(60px); opacity: 0; }
  /* 交互提示浮层（组件下方，纯文字气泡，不挡交互） */
  .guide-hint {
    position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 20;
    opacity: 0;
    transition: opacity .4s;
  }
  .guide-hint.show { opacity: 1; }
  .guide-hint.hide { opacity: 0; transition: opacity .5s; }
  .guide-hint-txt {
    background: rgba(18, 26, 38, .85); border: 1px solid rgba(120, 160, 210, .3);
    color: #cfe3ff; padding: 7px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 500; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  }
  .guide-actions { display: flex; gap: 10px; }
  .guide-cta {
    background: #2f6fb8; color: #fff; border: none;
    padding: 9px 26px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .guide-cta:hover { background: #3d82d0; }
  @media (max-width: 700px) {
    .guide-stage { padding: 0 12px; }
    .guide-step { max-width: 100%; max-height: 62vh; }
    .guide-arrow { width: 38px; height: 38px; font-size: 22px; }
    .guide-arrow.prev { left: 6px; }
    .guide-arrow.next { right: 6px; }
    .guide-text { font-size: 12px; }
  }
  @keyframes boom {
    0% { text-shadow: 0 0 4px #ff0000, 0 0 12px #ff0000; color: #ff0000; transform: translateX(-4px); }
    8% { text-shadow: 0 0 4px #ff8800, 0 0 12px #ff8800; color: #ff8800; transform: translateX(4px); }
    16% { text-shadow: 0 0 4px #ffff00, 0 0 12px #ffff00; color: #ffff00; transform: translateX(-3px); }
    24% { text-shadow: 0 0 4px #00ff00, 0 0 12px #00ff00; color: #00ff00; transform: translateX(3px); }
    32% { text-shadow: 0 0 4px #00ffff, 0 0 12px #00ffff; color: #00ffff; transform: translateX(-2px); }
    40% { text-shadow: 0 0 4px #0088ff, 0 0 12px #0088ff; color: #0088ff; transform: translateX(2px); }
    48% { text-shadow: 0 0 4px #8800ff, 0 0 12px #8800ff; color: #8800ff; transform: translateX(-1px); }
    56% { text-shadow: 0 0 4px #ff00ff, 0 0 12px #ff00ff; color: #ff00ff; transform: translateX(1px); }
    64% { text-shadow: 0 0 4px #ff0088, 0 0 12px #ff0088; color: #ff0088; transform: translateX(-3px); }
    72% { text-shadow: 0 0 4px #ff4400, 0 0 12px #ff4400; color: #ff4400; transform: translateX(3px); }
    80% { text-shadow: 0 0 8px #ffffff, 0 0 20px #ffffff, 0 0 40px #ffffff; color: #ffffff; transform: translateX(0); }
    90% { text-shadow: 0 0 4px #ff0000, 0 0 12px #ff0000; color: #ff0000; transform: translateX(-2px); }
    100% { text-shadow: 0 0 4px #ff6600, 0 0 12px #ff6600; color: #ff6600; transform: translateX(0); }
  }
  .boom { display: inline-block; cursor: pointer; transition: none; }
  .boom-active { animation: boom 0.35s ease-in-out infinite; display: inline-block; }
  @media (max-width: 700px) {
    body { padding: 20px 8px 60px; }
    h1 { font-size: 24px; }
    .stage { gap: 20px; }
    .pair { gap: 20px; }
    .frame { width: 100%; max-width: 640px; height: 260px; }
    .frame.single { height: 380px; }
    .frame.button { max-width: 320px; height: 120px; }
    .nav button { font-size: 12px; padding: 6px 10px; }
    .splash-card { padding: 28px 22px 24px; }
    .splash-card h2 { font-size: 20px; }
    .splash-card p { font-size: 12px; line-height: 1.8; }
    .splash-list { font-size: 12px; }
    .splash-tag { min-width: 44px; font-size: 10px; padding: 2px 6px; }
    .splash-note { font-size: 11px; }
  }
  /* ---- 开屏品牌开场动画 ---- */
  .intro {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0e1622 0%, #070b12 70%, #05070c 100%);
    transition: opacity .5s;
  }
  .intro.off { opacity: 0; pointer-events: none; }
  .intro-glow {
    position: absolute; width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(80, 140, 230, .22) 0%, rgba(80, 140, 230, .05) 40%, transparent 70%);
    filter: blur(30px);
    animation: intro-glow 2.2s ease-in-out infinite;
  }
  @keyframes intro-glow {
    0%, 100% { transform: scale(1); opacity: .8; }
    50% { transform: scale(1.15); opacity: 1; }
  }
  .intro-title {
    position: relative;
    font-size: 34px; font-weight: 600; letter-spacing: 1px;
    color: #f2f7ff;
    text-shadow: 0 0 30px rgba(120, 170, 255, .35);
    /* 初始超大（超出屏幕），动画缩回正常 → 大气开场 */
    transform: scale(5);
    opacity: 0;
    animation: intro-title 1.1s cubic-bezier(.22, .61, .36, 1) forwards .1s;
  }
  @keyframes intro-title {
    0% { opacity: 0; transform: scale(5); letter-spacing: 6px; }
    35% { opacity: 1; transform: scale(4.2); }
    100% { opacity: 1; transform: scale(1); letter-spacing: 1px; }
  }
  .intro-sub {
    position: relative;
    margin-top: 14px;
    font-size: 14px; color: #7d93ae; letter-spacing: 4px;
    opacity: 0;
    animation: intro-sub 1s ease forwards .8s;
  }
  @keyframes intro-sub {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .intro-line {
    position: relative;
    margin-top: 30px;
    width: 160px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #4f8fe0, transparent);
    background-size: 200% 100%;
    animation: intro-line 1.6s linear infinite;
    opacity: 0;
    animation-delay: .8s;
  }
  @keyframes intro-line {
    0% { background-position: 200% 0; opacity: 0; }
    15% { opacity: .9; }
    85% { opacity: .9; }
    100% { background-position: -200% 0; opacity: 0; }
  }
  .intro-note {
    position: absolute; bottom: 9%;
    font-size: 12px; color: #5a6e88; letter-spacing: 1px;
    opacity: 0;
    animation: intro-sub 1s ease forwards 1s;
  }
  @media (max-width: 700px) {
    .intro-title { font-size: 26px; }
    .intro-glow { width: 300px; height: 300px; }
  }
</style>
</head>
<body>
<!-- 开屏品牌开场动画 -->
<div class="intro" id="intro">
  <div class="intro-glow"></div>
  <div class="intro-title">GooseHyperGlass</div>
  <div class="intro-sub">LIQUID GLASS CDN</div>
  <div class="intro-line"></div>
  <div class="intro-note">首次加载较慢，请稍候</div>
</div>

<header>
  <h1>GooseHyperGlassCDN 2.5</h1>
  <p align="center" class="badges">
    <a href="https://github.com/Minecraftgoose/GooseHyperGlass/blob/main/LICENSE"><img src="https://img.shields.io/badge/license-Apache--2.0-blue.svg" alt="Apache License 2.0"></a>
    <a href="https://glass.goose.cc.cd/liquid-glass.js"><img src="https://img.shields.io/badge/CDN-online-brightgreen.svg" alt="CDN"></a>
    <img src="https://img.shields.io/badge/tech-WebGL%201.0-orange.svg" alt="WebGL">
    <img src="https://img.shields.io/badge/zero-deps-9cf.svg" alt="Zero Dependencies">
    <img src="https://img.shields.io/badge/source-582KB%20TypeScript-yellow.svg" alt="TypeScript">
    <img src="https://img.shields.io/badge/7-components-ff69b4.svg" alt="Components">
    <img src="https://img.shields.io/github/stars/Minecraftgoose/GooseHyperGlass?style=social" alt="Stars">
    <img src="https://img.shields.io/github/last-commit/Minecraftgoose/GooseHyperGlass?label=updated" alt="Last Commit">
  </p>
  <p class="lead">纯 WebGL 渲染的液态玻璃 UI 组件库。零依赖，一行 <code>&lt;script&gt;</code> 即用。下方每个组件展示透明背景版（壁纸折射）和白卡版（白色胶囊底板）上下对比。</p>
  <a class="doc-link" href="./doc/">查看完整接入文档</a> <a class="doc-link" href="https://github.com/Minecraftgoose/GooseHyperGlass" style="background:#333;border:1px solid #555">GitHub</a>
</header>

<div class="splash hidden" id="splash">
  <div class="splash-card">
    <button class="splash-close" id="splashClose" aria-label="关闭">×</button>
    <h2>GooseHyperGlass</h2>
    <ul class="splash-list">
      <li><span class="splash-tag">原项目</span><a href="https://github.com/Kyant0/AndroidLiquidGlass">AndroidLiquidGlass</a><span class="splash-note">（Android）</span></li>
      <li><span class="splash-tag">移植版</span><a href="javascript:void(0)" onclick="this.classList.toggle('boom-active');return false" class="boom">liquid-glass-webgl</a><span class="splash-note">（WebGL）</span></li>
      <li><span class="splash-tag">动画参考</span><a href="https://github.com/aaaa-zhen/siri-glsl">siri-glsl</a><span class="splash-note">（Siri 动画，MIT）</span></li>
    </ul>
    <a href="https://github.com/Minecraftgoose/GooseHyperGlass" class="splash-github">GitHub 仓库 →</a>
    <button class="splash-cta" id="splashGo">开始试玩</button>
  </div>
</div>

<div class="nav" id="nav">
  <button data-group="toggle" class="active">开关</button>
  <button data-group="slider">滑块</button>
  <button data-group="bottom-tabs">底部标签栏</button>
  <button data-group="buttons">按钮</button>
  <button data-group="dialog">对话框</button>
  <button data-group="scroll-container">滚动容器</button>
  <button data-group="rating">评分</button>
  <button data-group="siri-wave">Siri 声波</button>
  <button data-group="search">搜索框</button>
</div>

<div class="stage" id="stage"></div>

<script src="./liquid-glass.js"></script>
<script src="./guide.js"></script>
<script>
  var nav = document.getElementById('nav');
  var stage = document.getElementById('stage');

  // ---- 分批加载调度：组件逐个插入 DOM 再初始化，避免首帧同时建多个 WebGL context ----
  // 壁纸走 wallpaper.jpg 图片（组件 wallpaper 属性直接吃 URL），不再依赖 wallpaper.js base64 脚本
  var _wpReady = true;
  var _jobQueue = [];
  var _pumping = false;
  function pump() {
    if (_pumping || !_jobQueue.length) return;
    _pumping = true;
    var job = _jobQueue.shift();
    job();
    setTimeout(function () { _pumping = false; pump(); }, 150);
  }

  var GROUPS = {
    'toggle': {
      pairs: [
        { mode: 'single-toggle', tag: '透明背景版' },
        { mode: 'toggle-card', tag: '白卡版' }
      ]
    },
    'slider': {
      pairs: [
        { mode: 'single-slider', tag: '透明背景版' },
        { mode: 'slider-card', tag: '白卡版' }
      ]
    },
    'bottom-tabs': {
      pairs: [
        { mode: 'single-bottom-tabs', tag: '3 tab', tabs: [[{icon:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z',viewport:24,label:'首页'},{icon:'M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z',viewport:24,label:'发现'},{icon:'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',viewport:24,label:'收藏'}]] },
        { mode: 'bottom-tabs-2', tag: '4 tab', tabs: [[{icon:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z',viewport:24,label:'首页'},{icon:'M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z',viewport:24,label:'发现'},{icon:'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',viewport:24,label:'收藏'}], [{icon:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z',viewport:24,label:'首页'},{icon:'M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z',viewport:24,label:'发现'},{icon:'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',viewport:24,label:'收藏'},{icon:'M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z',viewport:24,label:'我的'}]] }
      ]
    },
    'buttons': {
      buttons: [
        { id: 'btn-transparent', label: '透明', style: 'transparent' },
        { id: 'btn-surface', label: '表面', style: 'surface' },
        { id: 'btn-blue', label: '蓝色', style: 'blue' },
        { id: 'btn-orange', label: '橙色', style: 'orange' }
      ]
    },
    'dialog': {
      single: { mode: 'dialog', dialog: { title:'提示', body:'这是一条示例通知消息。', cancelText:'取消', okayText:'确定' } }
    },
    'scroll-container': {
      single: { mode: 'scroll-container' }
    },
    'rating': {
      single: { mode: 'rating' }
    },
    'siri-wave': {
      pairs: [
        { mode: 'siri-wave', tag: 'Siri 声波 (wave)' },
        { mode: 'siri-wave', variant: 'orb', tag: '流体圆点 (orb)' }
      ]
    },
    'search': {
      element: 'liquid-glass-search'
    }
  };

  function makeFrame(cfg, isSingle, container) {
    var frame = document.createElement('div');
    frame.className = (cfg && cfg.mode === 'buttons') ? 'frame button' : (isSingle ? 'frame single' : 'frame');
    var el = document.createElement('liquid-glass');
    el.setAttribute('theme-button', '');
    // 顶配模式：dpr 拉到设备原生满格（默认 cap 1.5），玻璃质感/高光/内阴影全部最高清
    el.setAttribute('dpr', String(window.devicePixelRatio || 1));
    frame.appendChild(el);
    // 分批激活：元素先造好不入 DOM，轮到才 append（connected 即建 WebGL context）
    _jobQueue.push(function () {
      if (_wpReady && !el.getAttribute('wallpaper')) el.setAttribute('wallpaper', './wallpaper.jpg');
      el.setAttribute('mode', cfg.mode);
      if (cfg.variant) el.setAttribute('variant', cfg.variant);
      container.appendChild(frame);
      requestAnimationFrame(function () {
        if (cfg.tabs) el.setTabs(cfg.tabs);
        if (cfg.buttons) el.setButtons(cfg.buttons);
        if (cfg.dialog) el.setDialog(cfg.dialog);
      });
    });
    return frame;
  }

  var _loadTimer = 0;
  function showLoading() {
    stage.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
  }

  function select(group) {
    nav.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-group') === group);
    });
    showLoading();
    clearTimeout(_loadTimer);
    _loadTimer = setTimeout(function() {
      _jobQueue.length = 0;   // 丢弃上次未激活的组件
      var g = GROUPS[group];
      var oldEls = stage.querySelectorAll('liquid-glass');
      for (var o = 0; o < oldEls.length; o++) oldEls[o].remove();
      stage.innerHTML = '';
      if (g.pairs) {
        var pair = document.createElement('div');
        pair.className = 'pair';
        g.pairs.forEach(function(cfg) {
          var item = document.createElement('div');
          item.className = 'pair-item';
          var label = document.createElement('div');
          label.className = 'label';
          label.textContent = cfg.tag;
          item.appendChild(label);
          makeFrame(cfg, false, item);
          pair.appendChild(item);
        });
        stage.appendChild(pair);
      } else if (g.buttons) {
        var list = document.createElement('div');
        list.className = 'pair';
        g.buttons.forEach(function(b) {
          var item = document.createElement('div');
          item.className = 'pair-item';
          var label = document.createElement('div');
          label.className = 'label';
          label.textContent = b.label;
          item.appendChild(label);
          makeFrame({ mode: 'buttons', buttons: [b] }, true, item);
          list.appendChild(item);
        });
        stage.appendChild(list);
      } else if (g.single) {
        makeFrame(g.single, true, stage);
      } else if (g.element) {
        // 独立组件（如 <liquid-glass-search>）：不走 makeFrame
        var wrap = document.createElement('div');
        wrap.className = 'pair-item';
        var label = document.createElement('div');
        label.className = 'label';
        label.textContent = '从顶部黑边往下拖拽，拉过半屏松手凝聚成搜索框';
        wrap.appendChild(label);
        var frame = document.createElement('div');
        frame.className = 'frame single';
        var sel = document.createElement(g.element);
        if (_wpReady && !sel.getAttribute('wallpaper')) sel.setAttribute('wallpaper', './wallpaper.jpg');
        sel.setAttribute('dpr', String(window.devicePixelRatio || 1));
        frame.appendChild(sel);
        wrap.appendChild(frame);
        stage.appendChild(wrap);
      }
      pump();
    }, 50);
  }

  nav.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn) select(btn.getAttribute('data-group'));
  });

  // ---- 引导式介绍优先：默认不建 demo 组件，点"自由试玩"才进 demo ----
  // （避免引导期间后台新建 WebGL context 导致卡顿）
  var _demoStarted = false;
  window.__enterDemo = function () {
    if (_demoStarted) return;
    _demoStarted = true;
    select('toggle');
    // nav 溢出时：justify-content:center 会让左侧（开关/滑块）被裁掉且滚不回。
    // 改为 flex-start 左对齐，保证首项始终可见；只在溢出时切。
    requestAnimationFrame(function () {
      var n = document.getElementById('nav');
      if (n && n.scrollWidth > n.clientWidth + 2) {
        n.style.justifyContent = 'flex-start';
        n.scrollLeft = 0;
      }
    });
  };
  if (!window.__lgGuideLoaded) {
    // 无引导（guide.js 加载失败等）时兜底直接进 demo
    window.__enterDemo();
  }

  // ---- 声明弹窗（splash）由 guide.js 管理：退出引导时显示，点"开始试玩"进 demo ----

  var _activeGroup = 'toggle';
  var _origSelect = select;
  select = function(g) { _activeGroup = g; _origSelect(g); };
  new MutationObserver(function(mutations) {
    if (_activeGroup !== 'dialog') return;
    mutations.forEach(function(m) {
      if (m.type === 'attributes' && m.attributeName === 'mode') {
        var el = m.target;
        if (el.getAttribute('mode') !== 'dialog') {
          requestAnimationFrame(function() { el.setAttribute('mode', 'dialog'); });
        }
      }
    });
  }).observe(document.body, { attributes: true, subtree: true, attributeFilter: ['mode'] });
</script>
